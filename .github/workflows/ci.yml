name: CI - Calidad y Seguridad

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  agente-python:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas con PyTest
        run: python -m pytest tests/ -v


  seguridad-dependencias:
    name: Snyk - dependencias
    runs-on: ubuntu-latest
    needs: agente-python
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-docker.txt

      - name: Instalar dependencias a analizar
        run: python -m pip install -r requirements-docker.txt

      - name: Instalar CLI de Snyk
        run: npm install --global snyk

      - name: Comprobar secreto SNYK_TOKEN
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Falta configurar SNYK_TOKEN en Actions secrets"
            exit 1
          fi

      - name: Analizar dependencias y bloquear vulnerabilidades altas o críticas
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements-docker.txt --package-manager=pip --severity-threshold=high

  docker-scan:
    name: Docker Build y Trivy
    runs-on: ubuntu-latest
    needs: agente-python

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir imagen Docker
        run: docker build -t gmcomponents-ev2:latest .

      - name: Auditar paquetes del contenedor final
        shell: bash
        run: |
          docker run --rm -i --entrypoint /bin/sh gmcomponents-ev2:latest <<'CONTAINER_AUDIT'
          set -eu
          echo "=== Python activo ==="
          python --version
          echo "=== Dependencias de la aplicación ==="
          python - <<'PYTHON_AUDIT'
          from importlib.metadata import version
          for package in ("fastembed", "msgpack", "urllib3"):
              print(f"{package}={version(package)}")
          try:
              import pip
          except ImportError:
              print("pip ausente del runtime: correcto")
          else:
              raise RuntimeError("pip permanece en la imagen final")
          PYTHON_AUDIT
          echo "=== SBOM vendorizado de pip ==="
          if find /opt/venv -path '*/pip/_vendor/bom.cdx.json' -print | grep -q .; then
            echo "SBOM de pip encontrado: bloqueo"
            exit 1
          fi
          echo "No se encontró SBOM vendorizado de pip"
          CONTAINER_AUDIT

      - name: Escanear imagen Docker con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gmcomponents-ev2:latest
          format: table
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          version: v0.76.0

