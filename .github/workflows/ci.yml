name: CI-CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  agente-python:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas con PyTest
        run: python -m pytest tests/ -v


  seguridad-dependencias:
    name: Snyk - dependencias
    runs-on: ubuntu-latest
    needs: agente-python
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-docker.txt

      - name: Instalar dependencias a analizar
        run: python -m pip install -r requirements-docker.txt

      - name: Instalar CLI de Snyk
        run: npm install --global snyk

      - name: Comprobar secreto SNYK_TOKEN
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Falta configurar SNYK_TOKEN en Actions secrets"
            exit 1
          fi

      - name: Analizar dependencias y bloquear vulnerabilidades altas o críticas
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements-docker.txt --package-manager=pip --severity-threshold=high

  docker-scan:
    name: Docker Build y Trivy
    runs-on: ubuntu-latest
    needs: agente-python

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir imagen Docker
        run: docker build -t gmcomponents-ev2:latest .

      - name: Escanear imagen Docker con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gmcomponents-ev2:latest
          format: table
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  smoke-compose:
    name: Deploy simulado de evaluación (aislado)
    runs-on: ubuntu-latest
    needs: agente-python
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Verificar archivo Compose
        run: docker compose config

      - name: Construir e iniciar entorno aislado de prueba
        run: docker compose up -d --build

      - name: Registrar evidencia de despliegue simulado
        run: |
          mkdir -p evidencias
          printf 'Commit: %s\nEjecucion: %s\nEntorno: GitHub Actions Ubuntu (efimero, sin exposicion publica)\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > evidencias/despliegue.txt
          docker compose ps >> evidencias/despliegue.txt

      - name: Esperar healthcheck del servicio
        shell: bash
        run: |
          for i in {1..18}; do
            if curl --fail --silent http://localhost:8501/_stcore/health >/dev/null; then
              echo "Despliegue simulado saludable"
              echo "Resultado: healthcheck OK" >> evidencias/despliegue.txt
              echo "### Despliegue simulado de evaluación ✅" >> "$GITHUB_STEP_SUMMARY"
              echo "Docker Compose iniciado, endpoint de salud HTTP 200." >> "$GITHUB_STEP_SUMMARY"
              echo "**No es un despliegue de producción:** Snyk y Trivy siguen bloqueando el despliegue protegido." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          docker compose ps
          docker compose logs --tail=150
          exit 1

      - name: Adjuntar evidencia del entorno efímero
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-despliegue-simulado
          path: evidencias/
          if-no-files-found: warn

      - name: Detener contenedores de prueba
        if: always()
        run: docker compose down

  docker-deploy:
    name: Docker Deploy simulado
    runs-on: ubuntu-latest
    needs: [agente-python, seguridad-dependencias, docker-scan]

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Construir imagen Docker para despliegue verificado
        run: docker compose build

      - name: Levantar entorno simulado
        run: docker compose up -d --no-build

      - name: Mostrar contenedores
        run: docker compose ps

      - name: Esperar aplicación saludable
        shell: bash
        run: |
          echo "Esperando a GM Components..."

          for i in {1..12}; do
            if curl --fail --silent http://localhost:8501/_stcore/health > /dev/null; then
              echo "Aplicación saludable."
              exit 0
            fi

            echo "Intento $i/12 - esperando 10 segundos..."
            sleep 10
          done

          echo "La aplicación no respondió correctamente."
          docker compose ps
          docker compose logs
          exit 1

      - name: Verificar Healthcheck
        run: curl --fail http://localhost:8501/_stcore/health

      - name: Mostrar estado final
        run: docker compose ps

      - name: Detener entorno
        if: always()
        run: docker compose down